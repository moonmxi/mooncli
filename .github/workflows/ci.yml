name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
    # 推 v0.2.0 这样的标签就发正式版本；配好 SignPath 后正式版本会自动签名
    tags: ["v*"]
  pull_request:
  # 手动运行：填了 release（比如 v0.1.0）就把这次构建的安装包发到那个正式版本里
  workflow_dispatch:
    inputs:
      release:
        description: "发到哪个正式版本（比如 v0.1.0，留空就只构建）"
        required: false
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # 核心库测试。Ubuntu 镜像自带 pwsh，集成脚本的端到端测试会真的跑起来。
  rust:
    name: Rust 测试（Linux）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: pwsh -NoLogo -Command '$PSVersionTable.PSVersion.ToString()'
      # CI 和程序里内嵌的 PowerShell 脚本先在这里检查语法，免得发版本时才发现（docs/10 §5）
      - name: 检查内嵌的 PowerShell 脚本
        run: python3 tools/check_ps_scripts.py
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # 性能指标：10 万条历史逐字搜索 < 16ms（docs/09 §3），只在发布构建下检查
      - run: cargo test --release -p mooncli-history hundred_thousand -- --nocapture

  frontend:
    name: 界面测试与主题检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: python3 ../tools/check_contrast.py

  # 真正的目标平台：编译、跑测试（ConPTY 下的 pwsh 集成测试）、打安装包、发布
  windows:
    name: Windows 构建与安装包
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
      # 放在这里是为了能在步骤的 if 里判断"有没有配置 SignPath"
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      # 要发的正式版本：推 v* 标签时是标签名，手动运行时是填的 release，平常为空
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - name: 下载附带的新版 ConPTY
        run: python tools/fetch_conpty.py
      - name: 测试（系统自带的 ConPTY）
        run: cargo test
      - name: 集成测试（附带的新版 ConPTY）
        run: cargo test -p mooncli-pty --test pwsh_integration -- --nocapture
        env:
          MOONCLI_TEST_CONPTY_DIR: ${{ github.workspace }}\app\src-tauri\resources\conpty

      # 代码签名（可选）：仓库里配置了 Azure Artifact Signing（原 Trusted Signing）的密钥时自动签名，
      # 签过名的安装包不会再被 Windows 当成"未知发布者"拦下。没配置时照常打出未签名的安装包。
      # 需要的仓库密钥：AZURE_CLIENT_ID、AZURE_CLIENT_SECRET、AZURE_TENANT_ID、
      #   SIGNING_ENDPOINT（如 https://wus2.codesigning.azure.net）、SIGNING_ACCOUNT、SIGNING_PROFILE
      - name: 准备签名工具
        id: sign
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          SIGNING_ENDPOINT: ${{ secrets.SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ secrets.SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ secrets.SIGNING_PROFILE }}
        run: |
          if (-not $env:AZURE_CLIENT_ID) { "config=" >> $env:GITHUB_OUTPUT; Write-Host "没有配置签名密钥，打未签名的安装包"; exit 0 }
          cargo install trusted-signing-cli --locked
          $cmd = "trusted-signing-cli -e $env:SIGNING_ENDPOINT -a $env:SIGNING_ACCOUNT -c $env:SIGNING_PROFILE -d mooncli %1"
          $cfg = @{ bundle = @{ windows = @{ signCommand = $cmd } } } | ConvertTo-Json -Compress -Depth 5
          Set-Content -Path sign.json -Value $cfg -Encoding utf8
          "config=--config ../sign.json" >> $env:GITHUB_OUTPUT

      - name: 打包（NSIS 安装包）
        run: pnpm tauri build --bundles nsis ${{ steps.sign.outputs.config }}
        working-directory: app
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: 整理安装包
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force unsigned | Out-Null
          Copy-Item $exe.FullName unsigned/mooncli-setup-x64.exe

      # ---- 正式版本（推 v* 标签）：交给 SignPath 免费签名（开源项目计划），见 docs/10 §3 ----
      # 需要的仓库设置：密钥 SIGNPATH_API_TOKEN；变量 SIGNPATH_ORGANIZATION_ID、SIGNPATH_PROJECT_SLUG、
      #   SIGNPATH_SIGNING_POLICY_SLUG（可选 SIGNPATH_ARTIFACT_CONFIGURATION_SLUG）。没配置时发未签名的版本。
      # SignPath 那边每次签名都要项目负责人在网页上点一次"批准"，所以日常的 nightly 不签名。
      - name: 检查标签和版本号一致
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: |
          $v = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne $env:RELEASE_TAG) { throw "版本 $env:RELEASE_TAG 和 tauri.conf.json 里的版本 $v 不一致" }
      - name: 上传待签名的安装包
        id: unsigned
        if: env.RELEASE_TAG != '' && env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: mooncli-unsigned
          path: unsigned/mooncli-setup-x64.exe
      - name: SignPath 签名（等负责人批准）
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # 批准要人来点，多等一会儿
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
      - name: 发布正式版本
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $file = if (Test-Path signed/mooncli-setup-x64.exe) { "signed/mooncli-setup-x64.exe" } else { "unsigned/mooncli-setup-x64.exe" }
          $note = if ($file -like "signed/*") { "安装包已签名（SignPath Foundation 免费提供的开源项目证书）。" } else { "这个版本的安装包没有签名，Windows 可能会提示「未知发布者」：点「更多信息 → 仍要运行」即可。" }
          $tag = $env:RELEASE_TAG
          # 说明取 CHANGELOG.md 里这个版本的一节（## v0.2.0 到下一个 ## 之间），没有就只写安装说明
          $log = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($log, '(?ms)^## ' + [regex]::Escape($tag) + '[ \t]*\r?$(.*?)(?=^## |\z)')
          $changes = if ($m.Success) { $m.Groups[1].Value.Trim() + "`n`n" } else { "" }
          $notes = "$changes## 安装`n`n下载 mooncli-setup-x64.exe 直接运行即可安装（需要 Windows 10 / 11 和 PowerShell 7，没装的话 mooncli 会引导安装）。`n`n$note"
          # 在网页上用"新建发布"创建标签时，发布已经存在：只补上安装包和说明
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $file --clobber
            gh release edit $tag --notes $notes
          } else {
            gh release create $tag $file --title "mooncli $tag" --notes $notes --target "${{ github.sha }}"
          }

      # ---- 日常推送：直接把 .exe 发到 nightly 预发布版 ----
      # Actions 的"产物"一定会被打成 zip，所以发到 Release 页。下载地址固定：
      #   https://github.com/<owner>/<repo>/releases/download/nightly/mooncli-setup-x64.exe
      # 只由 main 发布：几个分支同时推送时一起删建 nightly 会互相冲突
      - name: 发布到 nightly 预发布版
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item unsigned/mooncli-setup-x64.exe mooncli-setup-x64.exe
          $sha = "${{ github.sha }}".Substring(0, 7)
          gh release delete nightly --cleanup-tag --yes 2>$null
          $notes = "自动构建：分支 ${{ github.ref_name }}，提交 $sha。`n`n下载 mooncli-setup-x64.exe 直接运行即可安装。"
          gh release create nightly mooncli-setup-x64.exe --prerelease --target "${{ github.sha }}" --title "mooncli 每日构建（$sha）" --notes $notes
